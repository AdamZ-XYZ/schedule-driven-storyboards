[project]
name = "opc-ai-skills"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "mcp[cli]>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "pytest-mock"]

[project.scripts]
opc-mcp = "opc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/opc_mcp", "src/opc_client", "src/session"]
